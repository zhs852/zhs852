<!doctype html>
<!-- © 2021–2026 zhs852 -->
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not Found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151417" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      const d = document.documentElement, get = k => { try { return localStorage.getItem(k); } catch (e) {} };
      const lang = get('lang') || (/^zh/i.test((navigator.languages || [])[0] || navigator.language) ? 'zh' : 'en');
      d.dataset.lang = lang;
      d.lang = lang === 'zh' ? 'zh-Hans' : 'en';
      if (get('theme')) d.dataset.theme = get('theme');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400..600&family=JetBrains+Mono:wght@400&family=Noto+Serif+SC:wght@400..600&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module">
    import { QUESTION } from '/assets/js/symbols.js';
    import { createField } from '/assets/js/field.js';
    import { initChrome } from '/assets/js/chrome.js';
    initChrome();
    createField(document.getElementById('field'), [QUESTION]);
  </script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <button class="icon-btn" id="lang-btn" type="button" popovertarget="lang-menu" data-icon="language"></button>
      <div class="menu" id="lang-menu" popover>
        <button type="button" value="en">English</button>
        <button type="button" value="zh">简体中文</button>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="half" d="M12 4a8 8 0 0 1 0 16z"/></svg>
      </button>
    </header>

    <main class="home">
      <figure class="field" aria-hidden="true"><canvas id="field"></canvas></figure>
      <div class="views">
        <section class="lost">
          <h1 class="name">404</h1>
          <p class="lost-sub"><span class="en">This page has lost its presence.</span><span class="zh">这一页失去了存在感。</span></p>
        </section>
      </div>
    </main>

    <footer class="foot">
      <p>© 2021–<span id="year">2026</span> <span class="en">Akarin</span><span class="zh">某阿卡林</span></p>
      <a href="/"><span class="en">Home</span><span class="zh">主页</span></a>
    </footer>
  </div>
</body>
</html>
